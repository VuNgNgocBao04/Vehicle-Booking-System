      - name: "[FE-07] Responsive Design & Cross-browser Testing"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "[FE-07] Responsive Design & Cross-browser Testing" \
            --label "frontend" \
            --body "## Mô tả
          Đảm bảo ứng dụng responsive trên mọi thiết bị và trình duyệt.

          ## Công việc cần làm
          - [ ] Test và fix responsive trên:
            - Mobile (320px - 768px): iPhone SE, iPhone 14, Samsung Galaxy
            - Tablet (768px - 1024px): iPad
            - Desktop (1024px+): HD và Full HD
          - [ ] Đảm bảo navigation, tables, forms đều hiển thị đúng trên mobile
          - [ ] Images responsive (img-fluid, object-fit)
          - [ ] Tables responsive (table-responsive wrapper)
          - [ ] Modal và forms responsive
          - [ ] Test trên Chrome, Firefox, Edge
          - [ ] Touch-friendly buttons và links (tối thiểu 44px touch target)
          - [ ] Kiểm tra tốc độ load (Google PageSpeed tùy chọn)

          ## Yêu cầu kỹ thuật
          - Bootstrap 5 breakpoints
          - CSS Media queries bổ sung nếu cần
          - Chrome DevTools device emulation

          ## Tiêu chí hoàn thành
          - Không có layout broken trên mobile và tablet
          - Trải nghiệm người dùng tốt trên mọi kích thước màn hình" 2>/dev/null || echo "Skipping"

      - name: "[FE-08] Quốc tế hóa (i18n) & UX Improvements"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "[FE-08] Quốc tế hóa (i18n) & UX Improvements" \
            --label "frontend" \
            --body "## Mô tả
          Hỗ trợ đa ngôn ngữ (Tiếng Việt / Tiếng Anh) và cải thiện UX tổng thể.

          ## Công việc cần làm
          - [ ] Cài đặt Resource files (.resx) cho i18n:
            - Resources.vi.resx (Tiếng Việt - mặc định)
            - Resources.en.resx (Tiếng Anh)
          - [ ] Language switcher (dropdown chọn ngôn ngữ)
          - [ ] Lưu lựa chọn ngôn ngữ vào Cookie
          - [ ] Localize: validation messages, UI labels, date/time format, currency format
          - [ ] Format ngày tháng theo locale (dd/MM/yyyy cho Việt Nam)
          - [ ] Format tiền tệ (VND và USD)
          - [ ] UX improvements:
            - Skeleton loading thay vì spinner (tùy chọn)
            - Infinite scroll hoặc Load More (tùy chọn)
            - Scroll to top button
            - Empty state illustrations khi không có dữ liệu

          ## Yêu cầu kỹ thuật
          - ASP.NET Resource Manager
          - CultureInfo configuration
          - Cookie-based language preference

          ## Tiêu chí hoàn thành
          - Chuyển đổi ngôn ngữ hoạt động đúng
          - Tất cả text hiển thị đúng theo ngôn ngữ được chọn" 2>/dev/null || echo "Skipping"
